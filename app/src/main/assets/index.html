<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEPG – Devis &amp; Clients</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#0b2641;--mut:#5b6b82;--bd:#dde3ec;--acc:#f5b01c;--blue:#0a73b0;--hdr:#0b2641;--dng:#d32f2f;--ok:#2e7d32;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--card:#13233d;--tx:#eef3fb;--mut:#9fb0c8;--bd:#23375a;--hdr:#071022}}
:root[data-theme="dark"]{--bg:#0a1424;--card:#13233d;--tx:#eef3fb;--mut:#9fb0c8;--bd:#23375a;--hdr:#071022}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:3px solid var(--acc)}
.brand{display:flex;align-items:center;gap:10px}.brand .logo{width:46px;height:46px;border-radius:50%;background:#fff}
.brand b{font-size:22px;letter-spacing:2px;color:var(--acc);display:block;line-height:1}
.brand small{font-size:11px;opacity:.85}
#call{background:var(--acc);color:#0b2641;text-decoration:none;font-weight:700;padding:8px 12px;border-radius:20px;font-size:14px}
main{padding:12px 12px 90px;max-width:720px;margin:auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--hdr);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:#b9c6da;padding:12px 0;font-size:13px;font-weight:600}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bar{display:flex;gap:8px;margin-bottom:10px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.btn{display:inline-block;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;font-weight:600;text-decoration:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#0b2641;white-space:nowrap}
.btn.dng{color:var(--dng);border-color:var(--dng)}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.badge{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bd);font-weight:700}
.badge.accepté{background:var(--ok);color:#fff}.badge.envoyé{background:var(--blue);color:#fff}.badge.refusé{background:var(--dng);color:#fff}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.sec{margin:14px 0 6px;padding:8px 10px;background:var(--bg);border-left:4px solid var(--acc);border-radius:6px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.sec span{font-size:14px}
.ln{border-bottom:1px solid var(--bd);padding:8px 0}
.ln input,.ln select{padding:8px 6px}
.ln .r2{display:flex;gap:6px;margin-top:6px;align-items:center}
.ln .r2 input{width:auto;flex:1;min-width:0}.ln .r2 input.q{flex:0 0 64px}.ln .r2 select{width:auto;flex:0 0 84px}
.ln .lt{text-align:right;font-size:14px;margin-top:4px;color:var(--mut)}.ln .lt b{color:var(--tx)}
.tot{text-align:right;font-size:15px;margin-top:10px}.tot b{font-size:20px}
h2{margin:6px 0 10px;font-size:19px}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#0b2641;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.2s;z-index:9}
#toast.show{opacity:1}
.warn{background:#fff6d6;color:#5a4500;border:1px solid var(--acc);border-radius:10px;padding:10px;margin-bottom:10px;font-size:14px}
#print{display:none}
@media print{
 :root{padding:0;background:#fff}
 body>*:not(#print){display:none!important}
 #print{display:block;color:#000;background:#fff;font:14px/1.4 Arial,sans-serif;padding:10px}
 #print .ph{display:flex;justify-content:space-between;border-bottom:3px solid #f5b01c;padding-bottom:8px;margin-bottom:12px}
 #print h1{margin:0;color:#0b2641;font-size:28px;letter-spacing:2px}#print h2{margin:0;font-size:20px}
 #print table{width:100%;border-collapse:collapse;margin:10px 0}
 #print th,#print td{border:1px solid #999;padding:6px;text-align:left}
 #print .r{text-align:right}#print .sig{margin-top:40px;border:1px dashed #999;height:80px;padding:6px}
}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={clients:[],quotes:[],cfg:{phone:'+22891086693',phone2:'+22891632518',addr:'',cur:'FCFA',tva:0},seq:{c:0,q:0}};
try{const r=localStorage.getItem('tepg');if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem('tepg',JSON.stringify(S))}catch(e){}};
let view='clients',eid=null,q=null,search='',pend='';
const cl=id=>S.clients.find(c=>c.id===id);
const digits=p=>String(p).replace(/[^\d+]/g,'');
const money=n=>(Math.round(n*100)/100).toLocaleString('fr-FR',{maximumFractionDigits:2})+' '+S.cfg.cur;
const sum=a=>(a||[]).reduce((s,l)=>s+(+l.n||0)*(+l.p||0),0);
const tot=x=>{const m=sum(x.lines),w=sum(x.labor),sub=m+w,tv=sub*(+x.tva||0)/100;return{m,w,sub,tv,t:sub+tv}};
const norm=x=>{x.lines=x.lines||[];x.labor=x.labor||[];return x};
const newL=s=>s==='labor'?{d:'',n:1,p:0,u:'forfait'}:{d:'',n:1,p:0};
const today=()=>new Date().toISOString().slice(0,10);
function toast(t){const e=$('#toast');e.textContent=t;e.className='show';setTimeout(()=>e.className='',2200)}

function listC(){
 const f=S.clients.filter(c=>(c.name+c.phone+c.addr).toLowerCase().includes(search.toLowerCase()));
 if(!f.length)return '<p class="empty">Aucun client.</p>';
 return f.map(c=>`<div class="card"><b>${esc(c.name)}</b><div class="mut">${esc(c.phone)}${c.addr?' · '+esc(c.addr):''}</div><div class="row">
 ${c.phone?`<a class="btn" href="tel:${digits(c.phone)}">Appeler</a><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${digits(c.phone).replace('+','')}">WhatsApp</a>`:''}
 <button class="btn pri" data-act="quotec" data-id="${c.id}">+ Devis</button>
 <button class="btn" data-act="editc" data-id="${c.id}">Modifier</button>
 <button class="btn dng" data-act="delc" data-id="${c.id}">${pend==='c'+c.id?'Confirmer ?':'Suppr.'}</button></div></div>`).join('');
}
function vClients(){return `<div class="bar"><input id="search" placeholder="Rechercher un client" value="${esc(search)}"><button class="btn pri" data-act="newc">+ Client</button></div><div id="list">${listC()}</div>`}
function vForm(){
 const c=eid==='new'?{}:cl(eid)||{};
 return `<h2>${eid==='new'?'Nouveau client':'Modifier le client'}</h2><div class="card">
 <label>Nom *</label><input id="fn" value="${esc(c.name)}">
 <label>Téléphone</label><input id="fp" type="tel" value="${esc(c.phone)}">
 <label>Adresse / chantier</label><input id="fa" value="${esc(c.addr)}">
 <div class="row"><button class="btn pri" data-act="savec">Enregistrer</button><button class="btn" data-act="nav" data-v="clients">Annuler</button></div></div>`;
}
function vQuotes(){
 const l=[...S.quotes].sort((a,b)=>b.id-a.id);
 return `<div class="bar"><button class="btn pri" data-act="newq" style="width:100%">+ Nouveau devis</button></div>`+(l.length?l.map(x=>`<div class="card" data-act="openq" data-id="${x.id}"><div class="top"><b>${esc(x.num)}</b><span class="badge ${esc(x.st)}">${esc(x.st)}</span></div><div>${esc((cl(x.cid)||{name:'Client supprimé'}).name)}</div><div class="top mut"><span>${esc(x.date)}</span><b>${money(tot(x).t)}</b></div></div>`).join(''):'<p class="empty">Aucun devis.</p>');
}
function lineH(sc,l,i){
 const lab=sc==='labor';
 return `<div class="ln"><input data-s="${sc}" data-l="${i}" data-k="d" placeholder="${lab?'Travail (ex : pose des prises)':'Article (ex : câble 2,5 mm²)'}" value="${esc(l.d)}">
 <div class="r2"><input class="q" data-s="${sc}" data-l="${i}" data-k="n" type="number" inputmode="decimal" step="any" placeholder="Qté" value="${l.n}">
 ${lab?`<select data-s="${sc}" data-l="${i}" data-k="u">${['forfait','heure','jour'].map(u=>`<option${u===(l.u||'forfait')?' selected':''}>${u}</option>`).join('')}</select>`:''}
 <input data-s="${sc}" data-l="${i}" data-k="p" type="number" inputmode="decimal" step="any" placeholder="Prix unitaire" value="${l.p}">
 <button class="btn dng" data-act="dell" data-s="${sc}" data-i="${i}">×</button></div>
 <div class="lt">Total ligne : <b data-lt="${sc}:${i}"></b></div></div>`;
}
function vQedit(){
 return `<h2>${q.num?esc(q.num):'Nouveau devis'}</h2><div class="card">
 <label>Client</label><select data-f="cid">${S.clients.map(c=>`<option value="${c.id}"${c.id===q.cid?' selected':''}>${esc(c.name)}</option>`).join('')}</select>
 <label>Date</label><input type="date" data-f="date" value="${esc(q.date)}">
 <div class="sec">🛒 Matériel à acheter <span>Sous-total : <b data-st="lines"></b></span></div>
 ${q.lines.map((l,i)=>lineH('lines',l,i)).join('')||'<p class="mut">Aucun article.</p>'}
 <div class="row"><button class="btn" data-act="addl" data-s="lines">+ Ajouter un article</button></div>
 <div class="sec">🔧 Main d'œuvre <span>Sous-total : <b data-st="labor"></b></span></div>
 ${q.labor.map((l,i)=>lineH('labor',l,i)).join('')||'<p class="mut">Aucune ligne.</p>'}
 <div class="row"><button class="btn" data-act="addl" data-s="labor">+ Ajouter de la main d'œuvre</button></div>
 <label>TVA (%)</label><input type="number" inputmode="decimal" step="any" data-f="tva" value="${q.tva}">
 <div class="tot" id="tot"></div>
 <label>Statut</label><select data-f="st">${['brouillon','envoyé','accepté','refusé'].map(s=>`<option${s===q.st?' selected':''}>${s}</option>`).join('')}</select>
 <label>Note (délais, conditions…)</label><textarea data-f="note" rows="3">${esc(q.note)}</textarea>
 <div class="row"><button class="btn pri" data-act="saveq">Enregistrer</button><button class="btn" data-act="printq">Imprimer / PDF</button><button class="btn" data-act="printshop">🛒 Liste d'achats</button><button class="btn" data-act="nav" data-v="quotes">Retour</button>${q.id?`<button class="btn dng" data-act="delq">${pend==='q'?'Confirmer ?':'Supprimer'}</button>`:''}</div></div>`;
}
function vSettings(){const g=S.cfg;return `<h2>Réglages</h2>${g.phone?'':'<div class="warn">Ajoutez le numéro de contact de TEPG : il apparaîtra en haut de l\'app et sur les devis.</div>'}<div class="card">
 <label>Téléphone TEPG</label><input id="sp" type="tel" value="${esc(g.phone)}" placeholder="+228 00 00 00 00"><label>Téléphone 2</label><input id="sp2" type="tel" value="${esc(g.phone2)}" placeholder="+228 00 00 00 00">
 <label>Adresse de l'entreprise</label><input id="sa" value="${esc(g.addr)}">
 <label>Devise</label><input id="sc" value="${esc(g.cur)}">
 <label>TVA par défaut (%)</label><input id="st" type="number" step="any" value="${g.tva}">
 <div class="row"><button class="btn pri" data-act="saves">Enregistrer</button></div></div>
 <p class="mut">Les données sont enregistrées sur cet appareil, dans ce navigateur.</p>`;
}
function render(){
 const a=$('#call');if(S.cfg.phone){a.hidden=false;a.href='tel:'+digits(S.cfg.phone)}else a.hidden=true;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(view==='form'?'clients':view==='qedit'?'quotes':view)));
 $('#main').innerHTML=view==='clients'?vClients():view==='form'?vForm():view==='quotes'?vQuotes():view==='qedit'?vQedit():vSettings();
 if(view==='qedit')upd();
}
function upd(){
 const t=tot(q);
 document.querySelectorAll('[data-lt]').forEach(e=>{const[sc,i]=e.dataset.lt.split(':'),l=q[sc][+i];e.textContent=money((+l.n||0)*(+l.p||0))});
 document.querySelectorAll('[data-st]').forEach(e=>e.textContent=money(t[e.dataset.st==='lines'?'m':'w']));
 $('#tot').innerHTML=`Matériel : ${money(t.m)}<br>Main d'œuvre : ${money(t.w)}<br>Sous-total : ${money(t.sub)}<br>${+q.tva?`TVA ${q.tva}% : ${money(t.tv)}<br>`:''}Total : <b>${money(t.t)}</b>`;
}
function newQuote(cid){
 if(!S.clients.length){toast("Ajoutez d'abord un client");view='form';eid='new';return render()}
 q={id:0,num:'',date:today(),cid:cid||S.clients[0].id,lines:[newL('lines')],labor:[newL('labor')],tva:S.cfg.tva,st:'brouillon',note:''};view='qedit';pend='';render();
}
const head=(x,title)=>{const g=S.cfg;return `<div class="ph"><div><h1>TEPG</h1><div>Travaux d'Électricité et Plomberie Générale</div>${g.phone?`<div>Tél : ${esc(g.phone)}${g.phone2?' / '+esc(g.phone2):''}</div>`:''}${g.addr?`<div>${esc(g.addr)}</div>`:''}</div><div class="r"><h2>${title} ${esc(x.num||'(brouillon)')}</h2><div>Date : ${esc(x.date)}</div></div></div>`};
const rows=(a,lab)=>(a||[]).filter(l=>l.d||+l.p).map(l=>`<tr><td>${esc(l.d)}</td><td class="r">${esc(l.n)}${lab?' '+esc(l.u||''):''}</td><td class="r">${money(+l.p||0)}</td><td class="r">${money((+l.n||0)*(+l.p||0))}</td></tr>`).join('');
const sect=(title,a,lab,st)=>{const r=rows(a,lab);return r?`<h3 style="margin:14px 0 0">${title}</h3><table><tr><th>Désignation</th><th class="r">Qté</th><th class="r">P.U.</th><th class="r">Total</th></tr>${r}<tr><td colspan="3" class="r"><b>Sous-total</b></td><td class="r"><b>${money(st)}</b></td></tr></table>`:''};
function printHtml(x){
 const c=cl(x.cid)||{name:'—'},t=tot(x);
 return head(x,'DEVIS')+`<p><b>Client :</b> ${esc(c.name)}${c.phone?' · '+esc(c.phone):''}${c.addr?'<br>'+esc(c.addr):''}</p>
 ${sect('Matériel',x.lines,false,t.m)}${sect("Main d'œuvre",x.labor,true,t.w)}
 <div class="r" style="margin-top:10px">${t.m&&t.w?`Matériel : ${money(t.m)}<br>Main d'œuvre : ${money(t.w)}<br>`:''}Sous-total : ${money(t.sub)}<br>${+x.tva?`TVA ${x.tva}% : ${money(t.tv)}<br>`:''}<b style="font-size:18px">Total : ${money(t.t)}</b></div>
 ${x.note?`<p><b>Note :</b> ${esc(x.note).replace(/\n/g,'<br>')}</p>`:''}<div class="sig">Bon pour accord (date, signature) :</div>`;
}
function shopHtml(x){
 const c=cl(x.cid)||{name:'—'},t=tot(x);
 const r=(x.lines||[]).filter(l=>l.d||+l.p).map(l=>`<tr><td style="width:24px">☐</td><td>${esc(l.d)}</td><td class="r">${esc(l.n)}</td><td class="r">${money(+l.p||0)}</td><td class="r">${money((+l.n||0)*(+l.p||0))}</td></tr>`).join('');
 return head(x,"LISTE D'ACHATS")+`<p><b>Chantier / client :</b> ${esc(c.name)}${c.addr?' · '+esc(c.addr):''}</p><table><tr><th></th><th>Article</th><th class="r">Qté</th><th class="r">Prix estimé</th><th class="r">Total</th></tr>${r||'<tr><td colspan="5">Aucun article.</td></tr>'}</table><div class="r"><b style="font-size:18px">Total matériel : ${money(t.m)}</b></div>`;
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,id=+b.dataset.id;
 if(b.tagName==='A')return;
 if(a==='nav'){view=b.dataset.v;pend='';q=null}
 else if(a==='newc'){view='form';eid='new'}
 else if(a==='editc'){view='form';eid=id}
 else if(a==='savec'){const n=$('#fn').value.trim();if(!n)return toast('Le nom est obligatoire');
  const d={name:n,phone:$('#fp').value.trim(),addr:$('#fa').value.trim()};
  if(eid==='new')S.clients.push({id:++S.seq.c,...d});else Object.assign(cl(eid),d);
  save();view='clients';toast('Client enregistré')}
 else if(a==='delc'){if(pend==='c'+id){S.clients=S.clients.filter(c=>c.id!==id);pend='';save();toast('Client supprimé')}else pend='c'+id}
 else if(a==='quotec')return newQuote(id);
 else if(a==='newq')return newQuote();
 else if(a==='openq'){q=norm(JSON.parse(JSON.stringify(S.quotes.find(x=>x.id===id))));view='qedit';pend=''}
 else if(a==='addl'){const sc=b.dataset.s;q[sc].push(newL(sc))}
 else if(a==='dell'){q[b.dataset.s].splice(+b.dataset.i,1)}
 else if(a==='saveq'){if(!q.id){q.id=++S.seq.q;q.num=`DEV-${q.date.slice(0,4)}-${String(q.id).padStart(3,'0')}`;S.quotes.push(q)}
  else S.quotes=S.quotes.map(x=>x.id===q.id?q:x);
  save();view='quotes';q=null;toast('Devis enregistré')}
 else if(a==='delq'){if(pend==='q'){S.quotes=S.quotes.filter(x=>x.id!==q.id);save();view='quotes';q=null;pend=''}else pend='q'}
 else if(a==='printshop'){$('#print').innerHTML=shopHtml(q);try{window.print()}catch(err){toast("Impression indisponible ici")}return}
 else if(a==='printq'){$('#print').innerHTML=printHtml(q);try{window.print()}catch(err){toast("Impression indisponible ici")}return}
 else if(a==='saves'){S.cfg={phone:$('#sp').value.trim(),phone2:$('#sp2').value.trim(),addr:$('#sa').value.trim(),cur:$('#sc').value.trim()||'€',tva:+$('#st').value||0};save();toast('Réglages enregistrés')}
 render();
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='search'){search=t.value;$('#list').innerHTML=listC();return}
 if(!q)return;
 if(t.dataset.f){const f=t.dataset.f;q[f]=(f==='cid'||f==='tva')?+t.value:t.value}
 else if(t.dataset.l!==undefined){const k=t.dataset.k;q[t.dataset.s][+t.dataset.l][k]=(k==='d'||k==='u')?t.value:(+t.value||0)}
 else return;
 upd();
});
render();
</script>
</body>
</html>
